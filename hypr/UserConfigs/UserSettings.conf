# User Settings
# This is where you put your own settings as this will not be touched during update 
# if the upgrade.sh is used.

# refer to Hyprland wiki for more info https://wiki.hyprland.org/Configuring/Variables/
# NOTE: some settings are in ~/.config/hypr/UserConfigs/UserDecorAnimations.conf
#
# Look on ~/.config/hypr/configs/SystemSettings.conf to know how to modify this



# Auto-reload plugins on startup
exec-once = hyprpm reload -n

plugin {
    hyprbars {
        bar_height = 24
        bar_color = rgba(1e1e2ecc)
        bar_text_font = JetBrainsMono Nerd Font
        bar_text_size = 10
        bar_text_color = rgba(cdd6f4ff)

        # Center title & align buttons to the left (macOS / iOS style)
        bar_title_enabled = true
        bar_text_align = center
        bar_buttons_alignment = left
        bar_padding = 10
        bar_button_padding = 6

        # Traffic Light Buttons (Left to Right)
        # Red: Close
        hyprbars-button = rgb(ff5f56), 16, 󰅖, hyprctl dispatch killactive
        # Yellow: Toggle Float
        hyprbars-button = rgb(ffbd2e), 16, , hyprctl dispatch togglefloating
        # Green: Fullscreen/Maximize
        hyprbars-button = rgb(27c93f), 16, 󰊓, hyprctl dispatch fullscreen 1
    }
}
